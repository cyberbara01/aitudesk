[package]
name = "aitudesk"
version = "1.0.0"
description = "AITU Desk: виджеты рабочего стола для Windows 11"
authors = ["cyberbara01"]
license = "MIT"
edition = "2021"
rust-version = "1.82"

[lib]
name = "aitudesk_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-store = "2.5"
tauri-plugin-opener = "2.7"
tauri-plugin-single-instance = "2.5"
window-vibrancy = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["rustls"] }
# The WebView2 settings interfaces wry does not expose (touchpad pinch on the tiles, layout.rs enable_pinch).
webview2-com = "0.39"
# «Свои виджеты»: pictures in config files (custom.rs) and random names for the stored copies.
base64 = "0.22"
getrandom = "0.3"

[dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Graphics_Dwm",
  "Win32_UI_Accessibility",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_System_Com",
  "Win32_System_SystemInformation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Power",
  "Win32_System_Registry",
  "Win32_System_Performance",
  "Win32_System_Threading",
  "Wdk_Graphics_Direct3D",
  "Devices_Bluetooth",
  "Devices_Enumeration",
  "Devices_Radios",
  "Networking_Connectivity",
  "UI_ViewManagement",
  "UI_Notifications",
  "Data_Xml_Dom",
  "Foundation",
  "Foundation_Collections",
]

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
