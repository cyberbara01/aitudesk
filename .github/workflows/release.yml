name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Windows installer (NSIS)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build and publish the installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "AITU Desk ${{ github.ref_name }}"
          releaseBody: |
            Установка: скачайте `AITU Desk_*_x64-setup.exe` и запустите. Установщик не требует прав администратора.
            SmartScreen может предупредить о неизвестном издателе: приложение не подписано сертификатом, код открыт в этом репозитории.
          releaseDraft: true
          prerelease: false
